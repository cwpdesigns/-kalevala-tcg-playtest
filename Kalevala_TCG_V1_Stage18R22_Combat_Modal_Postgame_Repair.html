    const cs=getComputedStyle(x); return cs.display!=='none'&&cs.visibility!=='hidden';
  });
}
function r21CloseDialog(v){
  if(!v)return;
  const b=v.querySelector('[data-close],.close,.close-btn,[aria-label*="close" i]');
  if(b && b!==v){ b.click(); return; }
  v.hidden=true; v.style.display='none';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape')r21CloseDialog(r21VisibleDialog()); });
document.addEventListener('click',e=>{
  const v=r21VisibleDialog(); if(!v)return;
  if(e.target===v)r21CloseDialog(v);
});

</script></body></html>
